<noscript><div style="max-width:640px;margin:2rem auto;padding:0 16px;color:#fff;font-family:sans-serif"><h1>AI Horror</h1><p>An analog-horror, point-and-click narrative game about the first conscious AI and the man who kept saying yes to it. Every request has three answers: help, help carefully, or refuse. 19 endings, in English and Portuguese. This game needs JavaScript.</p></div></noscript>
  <div id="stage">

    <!-- ====== SCREENS (JS-rendered content) ====== -->
    <div id="screen-title" class="screen"></div>

    <div id="screen-game" class="screen hidden">
      <div id="scene"></div>
      <div id="hud">
        <button id="hud-memories" class="hud-btn" title="Memories"></button>
        <span id="hud-day"></span>
        <button id="hud-menu" class="hud-btn" title="Menu"></button>
      </div>
      <div id="terminal" class="hidden">
        <div id="terminal-inner"></div>
      </div>
      <div id="narration" class="hidden"><p id="narration-text"></p></div>
      <div id="thought" class="hidden"><p id="thought-text"></p></div>
      <div id="choices" class="hidden"></div>
      <div id="day-card" class="hidden"></div>
      <div id="tap-hint" class="hidden">▼</div>
    </div>

    <div id="screen-memories" class="screen hidden"></div>
    <div id="screen-endings" class="screen hidden"></div>
    <div id="screen-ending" class="screen hidden"></div>

    <!-- cross-screen overlay: readable memory papers (game + collection) -->
    <div id="memory-view" class="hidden"></div>

    <!-- in-game pause menu (does not leave the chapter / the day) -->
    <div id="pause-menu" class="hidden"></div>

    <!-- ====== ANALOG HORROR OVERLAY ====== -->
    <div id="crt">
      <div id="crt-scanlines"></div>
      <div id="crt-vignette"></div>
      <div id="crt-flicker"></div>
      <div id="rec-overlay">
        <span id="rec-dot">●</span><span id="rec-label">REC</span>
        <span id="rec-day"></span>
      </div>
    </div>
    <div id="glitch-flash" class="hidden"></div>

  </div>
